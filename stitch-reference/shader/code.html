<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SHADER_START:ANIMATION_12 class="fixed inset-0 w-full h-full" -->
<div class="fixed inset-0 w-full h-full" style="display:block;">
<canvas id="shader-canvas-ANIMATION_12" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_12');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;
varying vec2 v_texCoord;

// Pseudo-random hash
float hash(vec3 p) {
    p  = fract(p * 0.1031);
    p += dot(p, p.yzx + 33.33);
    return fract((p.x + p.y) * p.z);
}

// 3D Noise for volume/particles
float noise(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                   mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                   mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
}

void main() {
    // Normalized coordinates (-1 to 1)
    vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);
    vec2 mouse = u_mouse / u_resolution.xy;
    
    // Scroll simulation/holographic distortion strength
    // u_mouse.y is being used as a proxy for scroll/tilt for this demo
    float distortion = (sin(u_time * 0.5) * 0.5 + 0.5) * 0.1;
    
    // Camera-like rotation
    float rx = u_time * 0.1 + (mouse.x * 0.5);
    float ry = u_time * 0.15 + (mouse.y * 0.5);
    mat2 rotX = mat2(cos(rx), -sin(rx), sin(rx), cos(rx));
    mat2 rotY = mat2(cos(ry), -sin(ry), sin(ry), cos(ry));
    
    // Grid Projection
    vec3 ray = vec3(uv, 1.0);
    ray.xz *= rotX;
    ray.yz *= rotY;
    
    // Neon Mesh (3D grid slicing)
    vec3 gridPos = ray * 4.0;
    vec3 gv = abs(fract(gridPos) - 0.5);
    float mesh = smoothstep(0.48, 0.5, max(gv.x, max(gv.y, gv.z)));
    
    // Holographic Chromatic Aberration
    float r = mesh;
    float g = smoothstep(0.48, 0.5, max(gv.x + distortion, max(gv.y, gv.z)));
    float b = smoothstep(0.48, 0.5, max(gv.x, max(gv.y + distortion, gv.z)));
    
    // Suspended Particles (Volumetric noise)
    float particles = 0.0;
    vec3 pPos = ray * 10.0 + u_time * 0.2;
    float n = noise(pPos);
    if(n > 0.8) {
        particles = smoothstep(0.8, 1.0, n) * 0.8;
    }
    
    // Energy Pulses along the mesh
    float pulse = sin(gridPos.x * 2.0 + gridPos.y * 2.0 + u_time * 5.0) * 0.5 + 0.5;
    pulse *= mesh;
    
    // Colors from Design System
    vec3 bgColor = vec3(0.027, 0.039, 0.035); // #070A09
    vec3 neonLime = vec3(0.71, 0.96, 0.26);   // #B6F542
    vec3 cyanAccent = vec3(0.25, 0.85, 0.91); // #40D9E8 (Smart-meter cyan)
    
    // Composite
    vec3 col = bgColor;
    col += vec3(r, g, b) * neonLime * 0.4; // Neon mesh with aberration
    col += pulse * cyanAccent * 0.6;       // Cyan energy pulses
    col += particles * neonLime;           // Floating nodes
    
    // Scanlines / Holographic flicker
    float scanline = sin(gl_FragCoord.y * 0.5 + u_time * 10.0) * 0.02;
    col += scanline;
    
    // Vignette / Depth fade
    col *= 1.2 - length(uv);
    
    gl_FragColor = vec4(col, 1.0);
}
`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
</div>
<!-- STITCH_SHADER_END:ANIMATION_12 -->
</body>
</html>
